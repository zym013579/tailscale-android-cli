name: Build Android binaries
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        default: false
    outputs:
      version:
        description: Tailscale version
        value: ${{ jobs.metadata.outputs.version }}
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build combined daemon and CLI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH: ${{ matrix.arch }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre); fi
          ./scripts/android.sh build "${args[@]}" "$ARCH"
      - name: Verify ELF, archive and version metadata
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/verify-android.py "dist/tailscaled.$ARCH" "$ARCH"
          go version -m "dist/tailscaled.$ARCH"
          tar -tzf "dist/tailscale_${VERSION}_${ARCH}.tgz"
          cd dist
          sha256sum "tailscale_${VERSION}_${ARCH}.tgz" > "tailscale_${VERSION}_${ARCH}.tgz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check build script and Android packages
        run: |
          bash -n scripts/android.sh
          ./scripts/android.sh check arm64
      - name: Test SSH environment handling and firewall marks
        run: |
          go test ./ssh/tailssh -run 'Test(IncubatorEnvServerOnly|ForwardedEnv|ParseIncubatorArgsEnvFD|LoadForwardedEnv|FilterEnv|IsDangerousEnvVar|MatchAcceptEnvPattern|AcceptEnvPair|PathFromPAM|ExpandDefaultPath)'
          go test ./util/linuxfw ./tsconst ./util/osuser
